[package]
name = "qm_engine"
version = "5.4.0"
edition = "2021"
description = "QMvir High-Performance Database Engine - Rust Core"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "qm_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings (optional — disabled for cross-compilation)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

# Async runtime for Gateway
tokio = { version = "1.36", features = ["full", "rt-multi-thread", "net", "io-util", "sync", "macros"] }

# SQL Parser
sqlparser = { version = "0.43", features = ["visitor"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.3"
zstd = "0.13"

# Data structures
ahash = "0.8"
hashbrown = "0.14"
dashmap = "5.5"
crossbeam = "0.8"
parking_lot = "0.12"
num_cpus = "1.16"
bytes = "1.5"

# SIMD & Performance
wide = "0.7"
rayon = "1.8"

# Memory mapping for storage
memmap2 = "0.9"

# Utilities
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

# CRC for WAL integrity  
crc32fast = "1.4"

# Password hashing for auth
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Auth / SCRAM
argon2 = "0.5"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
base64 = "0.22"

# Backup encryption
aes-gcm = "0.10"
lz4_flex = "0.11"
zeroize = "1"

# Web dashboard
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Apache Arrow / Parquet
arrow = { version = "53", default-features = false, features = ["ffi"] }
parquet = { version = "53", default-features = false, features = ["arrow", "zstd", "snap", "lz4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]

[[bench]]
name = "qm_benchmarks"
harness = false
required-features = []

[[bin]]
name = "qm"
path = "src/bin/qm.rs"

[[bin]]
name = "qm_web"
path = "src/bin/qm_web.rs"

[[bin]]
name = "native_sql_core_bench"
path = "src/bin/native_sql_core_bench.rs"

[[bin]]
name = "hnsw_rust_benchmark"
path = "src/bin/hnsw_rust_benchmark.rs"

[[example]]
name = "vector_benchmark"
path = "examples/vector_benchmark.rs"

[[test]]
name = "bench_engine"
path = "tests/bench_engine.rs"

[[test]]
name = "bench_new_components"
path = "tests/bench_new_components.rs"

[[test]]
name = "mvcc_integration"
path = "tests/mvcc_integration.rs"

[[test]]
name = "native_sql_identity_uuid_json_hash"
path = "tests/native_sql_identity_uuid_json_hash.rs"

[[test]]
name = "native_sql_query_update_delete_audit"
path = "tests/native_sql_query_update_delete_audit.rs"

[[test]]
name = "release_crash_recovery"
path = "tests/release_crash_recovery.rs"

[[test]]
name = "release_crash_kill_recovery"
path = "tests/release_crash_kill_recovery.rs"
