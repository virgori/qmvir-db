# Fair segment benchmarks: QM Python harness + Qdrant both in Docker on the same bridge.
#
# Usage (from repo root on quizzman):
#   bash scripts/run_quizzman_docker_fair_bench.sh
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qm-bench-qdrant
    ports:
      - "6333:6333"
    networks: [qm_bench_net]

  qm-bench:
    image: qm-bench:latest
    container_name: qm-bench-runner
    depends_on:
      - qdrant
    environment:
      QM_DEPLOYMENT: docker_bridge
      QDRANT_DEPLOYMENT: docker_bridge
      DUCKDB_DEPLOYMENT: in_process_embedded
      QDRANT_URL: http://qdrant:6333
      BENCHMARK_HOST: ${BENCHMARK_HOST:-quizzman}
      PYTHONPATH: /bench/scripts
    volumes:
      - ./:/bench/scripts:ro
      - /tmp:/tmp
    networks: [qm_bench_net]

networks:
  qm_bench_net:
    driver: bridge
