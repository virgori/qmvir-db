[package]
name = "qmvir-studio"
version = "1.0.0"
description = "QMvir Studio — Native Database Admin App"
authors = ["QMvir Engineering"]
license = "Proprietary"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
flate2 = "1.0"
tar = "0.4"

# QMvir engine — linked directly as rlib (in-process, zero-latency)
qm_engine = { path = "../../qm_engine", default-features = false, features = ["auto-initialize"] }

[features]
devtools = ["tauri/devtools"]
