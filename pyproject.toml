[build-system]
requires = ["maturin>=1.4"]
build-backend = "maturin"

[project]
name = "qmvir"
version = "6.2.8"
description = "QMvir — High-Performance Database Engine (Rust)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "VIRGORI Source Available License"}
authors = [
    {name = "QM Team"}
]

keywords = [
    "database",
    "search-engine",
    "vector-search",
    "analytics",
    "rust",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.maturin]
manifest-path = "qm_engine/Cargo.toml"
module-name = "qm_engine"
features = ["extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_rust_engine.py",
    "tests/test_native_sql_python_bridge_identity_uuid_json.py",
    "tests/test_python_rust_bridge_columnar.py",
    "tests/test_python_rust_bridge_true_zero_copy.py",
]
asyncio_mode = "auto"
