name: Publish Release Binaries

# Triggered manually or by the source repo's release workflow via repository_dispatch
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.3.0)'
        required: true
        type: string
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────
  #  Build Linux x86_64 (uses manylinux container for glibc compat)
  # ──────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    name: build / linux-x86_64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: virgori/qmvir
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build setuptools wheel numpy

      - name: Build qm_engine (manylinux container)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: 2_28
          args: --release -i python3.13 --out dist/
          working-directory: qm_engine
        env:
          RUSTFLAGS: '-C target-cpu=x86-64-v2'

      - name: Build qm_native (manylinux container)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: 2_28
          args: --release -i python3.13 --out dist/
          working-directory: qm_native
        env:
          RUSTFLAGS: '-C target-cpu=x86-64-v2'

      - name: Build qm_native_c
        working-directory: qm_native_c
        run: python setup.py bdist_wheel --dist-dir ../dist/

      - name: Build qmvir Python wheel
        run: python -m build --wheel --outdir dist/

      - name: Package bundle
        run: |
          mkdir -p bundle
          cp dist/*.whl bundle/ 2>/dev/null || true
          cp qm_engine/dist/*.whl bundle/ 2>/dev/null || true
          cp qm_native/dist/*.whl bundle/ 2>/dev/null || true
          cp LICENSE bundle/ 2>/dev/null || true
          tar czf "qmvir-linux-x86_64.tar.gz" -C bundle .
          ls -la qmvir-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: qmvir-linux-x86_64
          path: "qmvir-linux-x86_64.tar.gz"

  # ──────────────────────────────────────────────────────────
  #  Build Linux ARM64 (uses manylinux container + QEMU emulation)
  # ──────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-22.04
    name: build / linux-arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: virgori/qmvir
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build tools
        run: pip install build setuptools wheel numpy

      - name: Build qm_engine (manylinux aarch64)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: 2_28
          args: --release -i python3.13 --out dist/
          working-directory: qm_engine
        env:
          RUSTFLAGS: '-C target-cpu=generic'
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Build qm_native (manylinux aarch64)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: 2_28
          args: --release -i python3.13 --out dist/
          working-directory: qm_native
        env:
          RUSTFLAGS: '-C target-cpu=generic'
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Build qmvir Python wheel
        run: python -m build --wheel --outdir dist/

      - name: Package bundle
        run: |
          mkdir -p bundle
          cp dist/*.whl bundle/ 2>/dev/null || true
          cp qm_engine/dist/*.whl bundle/ 2>/dev/null || true
          cp qm_native/dist/*.whl bundle/ 2>/dev/null || true
          cp LICENSE bundle/ 2>/dev/null || true
          tar czf "qmvir-linux-arm64.tar.gz" -C bundle .
          ls -la qmvir-linux-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: qmvir-linux-arm64
          path: "qmvir-linux-arm64.tar.gz"

  # ──────────────────────────────────────────────────────────
  #  Build other platforms (macOS, Windows)
  # ──────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            rustflags: '-C target-cpu=apple-m1'

          - os: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: virgori/qmvir
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install maturin build setuptools wheel numpy

      - name: Build qm_engine
        working-directory: qm_engine
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: maturin build --release --target ${{ matrix.target }} -i python3 --out ../dist/
        shell: bash

      - name: Build qm_native
        working-directory: qm_native
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: maturin build --release --target ${{ matrix.target }} -i python3 --out ../dist/
        shell: bash

      - name: Build qm_native_c
        working-directory: qm_native_c
        run: python setup.py bdist_wheel --dist-dir ../dist/

      - name: Build qmvir Python wheel
        run: python -m build --wheel --outdir dist/

      - name: Package bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp dist/*.whl bundle/ 2>/dev/null || true
          cp LICENSE bundle/ 2>/dev/null || true
          tar czf "qmvir-${{ matrix.platform }}.tar.gz" -C bundle .
          ls -la qmvir-${{ matrix.platform }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: qmvir-${{ matrix.platform }}
          path: "qmvir-${{ matrix.platform }}.tar.gz"

  # ──────────────────────────────────────────────────────────
  #  Build QMvir Studio (Tauri desktop app)
  # ──────────────────────────────────────────────────────────
  build-studio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            rustflags: '-C target-cpu=apple-m1'
            bundles: 'dmg'

          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x86_64
            rustflags: '-C target-cpu=x86-64-v2'
            bundles: 'dmg'

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            rustflags: '-C target-cpu=x86-64-v2'
            bundles: 'deb,appimage'

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            rustflags: '-C target-cpu=x86-64-v2'
            bundles: 'msi,nsis'

    runs-on: ${{ matrix.os }}
    name: studio / ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: virgori/qmvir
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: qmvir-studio
        run: npm ci

      - name: Build Tauri app
        working-directory: qmvir-studio
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        shell: bash
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p studio-artifacts
          find qmvir-studio/src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} studio-artifacts/ \;
          ls -lh studio-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.platform }}
          path: studio-artifacts/*

  # ──────────────────────────────────────────────────────────
  #  Create GitHub Release (Engine + Studio)
  # ──────────────────────────────────────────────────────────
  release:
    needs: [build, build-linux, build-linux-arm64, build-studio]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    name: publish-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          # Include Studio installers
          find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -lh release/

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            echo "tag=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.4.0" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "QMvir ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## QMvir ${{ steps.version.outputs.tag }}

            ### QMvir Engine (Database Server)

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | macOS | ARM64 (Apple Silicon) | [qmvir-macos-arm64.tar.gz](https://github.com/virgori/qmvir-releases/releases/download/${{ steps.version.outputs.tag }}/qmvir-macos-arm64.tar.gz) |
            | macOS | x86_64 (Intel) | [qmvir-macos-x86_64.tar.gz](https://github.com/virgori/qmvir-releases/releases/download/${{ steps.version.outputs.tag }}/qmvir-macos-x86_64.tar.gz) |
            | Linux | x86_64 | [qmvir-linux-x86_64.tar.gz](https://github.com/virgori/qmvir-releases/releases/download/${{ steps.version.outputs.tag }}/qmvir-linux-x86_64.tar.gz) |
            | Linux | ARM64 | [qmvir-linux-arm64.tar.gz](https://github.com/virgori/qmvir-releases/releases/download/${{ steps.version.outputs.tag }}/qmvir-linux-arm64.tar.gz) |
            | Windows | x86_64 | [qmvir-windows-x86_64.tar.gz](https://github.com/virgori/qmvir-releases/releases/download/${{ steps.version.outputs.tag }}/qmvir-windows-x86_64.tar.gz) |

            ### QMvir Studio (Desktop Admin App)

            | Platform | Format |
            |----------|--------|
            | macOS ARM64 | `.dmg` |
            | macOS x86_64 | `.dmg` |
            | Linux x86_64 | `.deb` / `.AppImage` |
            | Windows x86_64 | `.msi` / `.exe` |

            ### Quick Install

            ```bash
            # Engine
            curl -fsSL https://raw.githubusercontent.com/virgori/qmvir-releases/main/install.sh | bash

            # Studio (macOS / Linux)
            curl -fsSL https://raw.githubusercontent.com/virgori/qmvir-releases/main/install-studio.sh | bash
            ```

            ### Changes
            See source repository for full changelog.
          files: release/*

  # ──────────────────────────────────────────────────────────
  #  Publish to npm (npmjs.com)
  # ──────────────────────────────────────────────────────────
  publish-npm:
    needs: [release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    name: npm / publish

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: virgori/qmvir
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        working-directory: npm
        run: |
          TAG_VERSION="${{ steps.version.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ -z "$TAG_VERSION" ]; then TAG_VERSION="1.0.0"; fi
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${TAG_VERSION}';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Publishing qmvir@${TAG_VERSION}"

      - name: Compile TypeScript SDK
        working-directory: npm
        run: |
          npx -p typescript tsc --declaration --module nodenext --target es2020 \
            --moduleResolution nodenext --esModuleInterop --outDir sdk sdk/client.ts

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
