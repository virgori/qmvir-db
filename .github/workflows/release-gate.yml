name: Release Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dev dependencies
        run: python -m pip install -U pip maturin .[dev]

      - name: Cargo check no default features
        run: cargo check --manifest-path qm_engine/Cargo.toml --no-default-features

      - name: Cargo check default features
        run: cargo check --manifest-path qm_engine/Cargo.toml

      - name: Cargo test no default features
        run: cargo test --manifest-path qm_engine/Cargo.toml --no-default-features

      - name: Python pytest
        run: python -m pytest -q

      - name: Repo duplicate hygiene
        run: bash scripts/check_no_space_number_duplicates.sh .

      - name: Crash and recovery smoke
        run: cargo test --manifest-path qm_engine/Cargo.toml --no-default-features --test release_crash_recovery

      - name: Benchmark smoke gate
        run: python scripts/release_benchmark_native_sql.py --quick --build-mode ci --feature-flags default
