# Build bare qm binaries from the private source repo and publish ONLY to
# virgori/qmvir-releases (no wheels, no npm package, no source tarballs).
name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v6.2.3)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qm-linux-x86_64
            ext: ''

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: qm-linux-aarch64
            ext: ''

          - os: macos-14
            target: aarch64-apple-darwin
            artifact: qm-macos-arm64
            ext: ''

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: qm-macos-x86_64
            ext: ''

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qm-windows-x86_64
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build qm (release, no default features)
        working-directory: qm_engine
        run: cargo build --release --no-default-features --bin qm --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="qm_engine/target/${{ matrix.target }}/release/qm${{ matrix.ext }}"
          dest="dist/${{ matrix.artifact }}${{ matrix.ext }}"
          cp "$src" "$dest"
          chmod +x "$dest" 2>/dev/null || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  publish-github:
    needs: build
    runs-on: ubuntu-22.04
    name: publish / qmvir-releases
    permissions:
      contents: write

    steps:
      - name: Resolve version tag
        id: ver
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          [[ "$tag" == v* ]] || tag="v${tag}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag to virgori/qmvir-releases"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'qm-*' -o -name 'qm-*.exe' \) -exec cp {} release/ \;
          echo "=== release assets ==="
          ls -lh release/

      - name: Create release on qmvir-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: virgori/qmvir-releases
          token: ${{ secrets.RELEASE_REPO_TOKEN || secrets.SOURCE_REPO_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: QMvir ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
