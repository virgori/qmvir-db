name: QMvir — Cross-Platform Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version (default: 3.13)'
        default: '3.13'
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.13' }}
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-C target-cpu=native'

# ════════════════════════════════════════════════════════════
#  QMvir has 4 distributable components:
#    1. qm_engine   — Rust (PyO3): DB core, gateway, SIMD SQL
#    2. qm_native   — Rust (Maturin): vector ops, HNSW index
#    3. qm_native_c — C (setuptools): SIMD distance functions
#    4. qmvir       — Python: orchestration, CLI, gateway layer
#
#  Build strategy:
#    - qm_engine + qm_native: maturin cross-compile per platform
#    - qm_native_c: setuptools build_ext per platform
#    - qmvir: pure Python wheel (depends on above)
#    - Docker: multi-arch images with pre-built wheels
# ════════════════════════════════════════════════════════════

jobs:
  # ──────────────────────────────────────────────────────────
  #  1. Build qm_engine (Rust/PyO3 shared library)
  # ──────────────────────────────────────────────────────────
  build-engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: qm_engine-macos-arm64
            rustflags: '-C target-cpu=apple-m1'

          # macOS x86_64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: qm_engine-macos-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qm_engine-linux-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

          # Linux ARM64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: qm_engine-linux-arm64
            cross: true
            rustflags: '-C target-cpu=generic'

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qm_engine-windows-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

    runs-on: ${{ matrix.os }}
    name: engine / ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install maturin
        run: pip install maturin

      # Cross-compilation toolchain for Linux ARM64
      - name: Install cross-compiler (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build qm_engine wheel
        working-directory: qm_engine
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          maturin build --release --target ${{ matrix.target }} --out ../dist/
          ls -la ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl

  # ──────────────────────────────────────────────────────────
  #  2. Build qm_native (Rust/Maturin — HNSW, vector ops)
  # ──────────────────────────────────────────────────────────
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: qm_native-macos-arm64
            rustflags: '-C target-cpu=apple-m1'

          - os: macos-13
            target: x86_64-apple-darwin
            artifact: qm_native-macos-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qm_native-linux-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: qm_native-linux-arm64
            cross: true
            rustflags: '-C target-cpu=generic'

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: qm_native-windows-x86_64
            rustflags: '-C target-cpu=x86-64-v2'

    runs-on: ${{ matrix.os }}
    name: native / ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install maturin
        run: pip install maturin

      - name: Install cross-compiler (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build qm_native wheel
        working-directory: qm_native
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          maturin build --release --target ${{ matrix.target }} --out ../dist/
          ls -la ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl

  # ──────────────────────────────────────────────────────────
  #  3. Build qm_native_c (C/SIMD extension)
  # ──────────────────────────────────────────────────────────
  build-native-c:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: qm_native_c-macos-arm64
          - os: macos-13
            artifact: qm_native_c-macos-x86_64
          - os: ubuntu-22.04
            artifact: qm_native_c-linux-x86_64
          - os: windows-latest
            artifact: qm_native_c-windows-x86_64

    runs-on: ${{ matrix.os }}
    name: c-ext / ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: pip install setuptools wheel numpy

      - name: Build qm_native_c wheel
        working-directory: qm_native_c
        run: |
          python setup.py bdist_wheel --dist-dir ../dist/
          ls -la ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl

  # ──────────────────────────────────────────────────────────
  #  4. Build qmvir Python wheel (pure Python orchestration)
  # ──────────────────────────────────────────────────────────
  build-python:
    runs-on: ubuntu-22.04
    name: python / qmvir

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build qmvir wheel
        run: |
          pip install build setuptools wheel
          python -m build --wheel --outdir dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: qmvir-python
          path: dist/*.whl

  # ──────────────────────────────────────────────────────────
  #  5. Docker multi-arch image
  # ──────────────────────────────────────────────────────────
  build-docker:
    needs: [build-engine, build-native, build-native-c, build-python]
    runs-on: ubuntu-22.04
    name: docker / multi-arch

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Download all wheel artifacts
      - uses: actions/download-artifact@v4
        with:
          path: all-wheels/

      # Assemble wheels per platform
      - name: Organize wheels
        run: |
          mkdir -p docker-wheels/linux-amd64 docker-wheels/linux-arm64

          # Linux x86_64 wheels
          cp all-wheels/qm_engine-linux-x86_64/*.whl docker-wheels/linux-amd64/ 2>/dev/null || true
          cp all-wheels/qm_native-linux-x86_64/*.whl docker-wheels/linux-amd64/ 2>/dev/null || true
          cp all-wheels/qm_native_c-linux-x86_64/*.whl docker-wheels/linux-amd64/ 2>/dev/null || true
          cp all-wheels/qmvir-python/*.whl docker-wheels/linux-amd64/ 2>/dev/null || true

          # Linux ARM64 wheels
          cp all-wheels/qm_engine-linux-arm64/*.whl docker-wheels/linux-arm64/ 2>/dev/null || true
          cp all-wheels/qm_native-linux-arm64/*.whl docker-wheels/linux-arm64/ 2>/dev/null || true
          cp all-wheels/qmvir-python/*.whl docker-wheels/linux-arm64/ 2>/dev/null || true

          echo "=== linux-amd64 wheels ==="
          ls -la docker-wheels/linux-amd64/
          echo "=== linux-arm64 wheels ==="
          ls -la docker-wheels/linux-arm64/

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            TARGETPLATFORM=${{ matrix.platform }}

  # ──────────────────────────────────────────────────────────
  #  6. Test matrix — verify each platform
  # ──────────────────────────────────────────────────────────
  test:
    needs: [build-engine, build-native, build-native-c, build-python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            engine: qm_engine-macos-arm64
            native: qm_native-macos-arm64
            native_c: qm_native_c-macos-arm64

          - os: macos-13
            engine: qm_engine-macos-x86_64
            native: qm_native-macos-x86_64
            native_c: qm_native_c-macos-x86_64

          - os: ubuntu-22.04
            engine: qm_engine-linux-x86_64
            native: qm_native-linux-x86_64
            native_c: qm_native_c-linux-x86_64

          - os: windows-latest
            engine: qm_engine-windows-x86_64
            native: qm_native-windows-x86_64
            native_c: qm_native_c-windows-x86_64

    runs-on: ${{ matrix.os }}
    name: test / ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Download all component wheels for this platform
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.engine }}
          path: wheels/
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native }}
          path: wheels/
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native_c }}
          path: wheels/
      - uses: actions/download-artifact@v4
        with:
          name: qmvir-python
          path: wheels/

      - name: Install all wheels
        shell: bash
        run: |
          pip install wheels/*.whl
          pip install pytest pytest-asyncio

      - name: Verify imports
        shell: bash
        run: |
          python -c "
          from qm_engine import PostgresGateway
          print('✓ qm_engine OK')
          try:
              from qm_native import NATIVE_AVAILABLE, HNSWIndex
              print(f'✓ qm_native OK (available={NATIVE_AVAILABLE})')
          except ImportError as e:
              print(f'⚠ qm_native: {e}')
          try:
              import qm_native_c
              print('✓ qm_native_c OK')
          except ImportError as e:
              print(f'⚠ qm_native_c: {e}')
          "

      - name: Run tests
        shell: bash
        run: python -m pytest tests/ -x -q --tb=short -k "not benchmark"

  # ──────────────────────────────────────────────────────────
  #  7. GitHub Release — generate assets
  # ──────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    name: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Package release
        run: |
          mkdir -p release

          # Create per-platform bundles (all wheels needed for that platform)
          for platform in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64 windows-x86_64; do
            mkdir -p "bundle-${platform}"

            # Collect engine wheel
            cp all-artifacts/qm_engine-${platform}/*.whl "bundle-${platform}/" 2>/dev/null || true
            # Collect native wheel
            cp all-artifacts/qm_native-${platform}/*.whl "bundle-${platform}/" 2>/dev/null || true
            # Collect C extension wheel
            cp all-artifacts/qm_native_c-${platform}/*.whl "bundle-${platform}/" 2>/dev/null || true
            # Collect Python wheel
            cp all-artifacts/qmvir-python/*.whl "bundle-${platform}/" 2>/dev/null || true

            if ls "bundle-${platform}"/*.whl 1>/dev/null 2>&1; then
              tar czf "release/qmvir-${platform}.tar.gz" -C "bundle-${platform}" .
              echo "✓ Packaged qmvir-${platform}.tar.gz"
            fi
          done

          # Also provide individual wheels
          mkdir -p release/wheels
          find all-artifacts -name "*.whl" -exec cp {} release/wheels/ \;

          echo "=== Release artifacts ==="
          ls -la release/
          ls -la release/wheels/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            release/qmvir-macos-arm64.tar.gz
            release/qmvir-macos-x86_64.tar.gz
            release/qmvir-linux-x86_64.tar.gz
            release/qmvir-linux-arm64.tar.gz
            release/qmvir-windows-x86_64.tar.gz
            release/wheels/*.whl
