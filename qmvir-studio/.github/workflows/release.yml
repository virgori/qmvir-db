name: QMvir Studio — Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# ════════════════════════════════════════════════════════════
#  QMvir Studio — Tauri 2 desktop app
#  Build strategy:
#    - Source is private (virgori/qmvir)
#    - qm_engine is a workspace sibling crate at ../../qm_engine
#    - Output: native installers (.dmg, .deb, .AppImage, .msi)
#    - Releases go to virgori/qmvir-releases (public)
# ════════════════════════════════════════════════════════════

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-arm64
            rustflags: '-C target-cpu=apple-m1'
            bundles: 'dmg'

          # macOS x86_64 (Intel)
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x86_64
            rustflags: '-C target-cpu=x86-64-v2'
            bundles: 'dmg'

          # Linux x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            rustflags: '-C target-cpu=x86-64-v2'
            bundles: 'deb,appimage'

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            rustflags: '-C target-cpu=x86-64-v2'
            bundles: 'msi,nsis'

    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.platform }}

    steps:
      # Checkout the FULL source repo (includes qm_engine, qmvir-studio, etc.)
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Linux: install webkit2gtk and other Tauri deps
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: qmvir-studio
        run: npm ci

      - name: Build Tauri app
        working-directory: qmvir-studio
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Collect build artifacts
      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          find qmvir-studio/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          find qmvir-studio/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.deb" -exec cp {} artifacts/ \;
          find qmvir-studio/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          find qmvir-studio/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" -exec cp {} artifacts/ \;
          find qmvir-studio/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.exe" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.platform }}
          path: artifacts/*

  # ──────────────────────────────────────────────────────────
  #  Publish release to qmvir-releases repo (public)
  # ──────────────────────────────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    name: publish-release

    steps:
      - uses: actions/checkout@v4
        with:
          repository: virgori/qmvir-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect release files
        run: |
          mkdir -p release
          find all-artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -lh release/

      - name: Create Release on qmvir-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: virgori/qmvir-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: studio-${{ steps.version.outputs.tag }}
          name: "QMvir Studio ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            ## QMvir Studio ${{ steps.version.outputs.tag }}

            Native database admin tool for QMvir Engine.

            ### Download

            | Platform | Architecture | Format |
            |----------|-------------|--------|
            | macOS | ARM64 (Apple Silicon) | `.dmg` |
            | macOS | x86_64 (Intel) | `.dmg` |
            | Linux | x86_64 | `.deb` / `.AppImage` |
            | Windows | x86_64 | `.msi` / `.exe` |

            ### Install

            **macOS:** Download `.dmg`, open it, drag QMvir Studio to Applications.

            **Linux (Debian/Ubuntu):**
            ```bash
            sudo dpkg -i qmvir-studio_*.deb
            ```

            **Linux (AppImage):**
            ```bash
            chmod +x QMvir-Studio_*.AppImage
            ./QMvir-Studio_*.AppImage
            ```

            **Windows:** Download and run the `.msi` installer.
          files: release/*
